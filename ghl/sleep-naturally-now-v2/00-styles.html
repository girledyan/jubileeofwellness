<!-- ===== 00: SHARED STYLES. Paste into a Custom HTML element at the TOP of the page. Every other block depends on it. ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  .snx {
    --night: #1d1530;
    --night-2: #3b2352;
    --plum: #9b046f;
    --plum-2: #c2408f;
    --lavender: #efe7f6;
    --cream: #fdfbf7;
    --sand: #f6f0e7;
    --gold: #e2bd78;
    --ink: #2e2a39;
    --muted: rgba(46, 42, 57, 0.72);
    --radius: 22px;
    --shadow: 0 24px 60px -24px rgba(46, 20, 60, 0.35);
    position: relative;
    width: 100%;
    margin: 0;
    font-family: 'Poppins', sans-serif;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.75;
    color: var(--muted);
    -webkit-font-smoothing: antialiased;
  }
  .snx *, .snx *::before, .snx *::after { box-sizing: border-box; }
  .snx img { display: block; max-width: 100%; height: auto; border: 0; }
  .snx p { margin: 0; }
  .snx h1, .snx h2, .snx h3 {
    margin: 0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .snx em { font-style: italic; font-weight: 500; }
  .snx-container { max-width: 1160px; margin: 0 auto; padding: 0 20px; }

  .snx .snx-eyebrow {
    display: inline-block;
    margin-bottom: 18px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .snx .snx-eyebrow--plum { color: var(--plum); }
  .snx .snx-title { font-size: clamp(36px, 6vw, 56px); }
  .snx .snx-subtitle {
    margin-top: 14px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(21px, 3vw, 26px);
    line-height: 1.35;
    color: var(--plum);
  }
  .snx-head { max-width: 720px; margin: 0 auto 56px; text-align: center; }
  .snx-head .snx-body { margin-top: 18px; }

  /* Buttons */
  .snx a.snx-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 54px;
    padding: 14px 32px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--plum-2), var(--plum));
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.03em;
    line-height: 1.2;
    text-align: center;
    text-decoration: none;
    box-shadow: 0 12px 30px -10px rgba(155, 4, 111, 0.6);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .snx a.snx-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -12px rgba(155, 4, 111, 0.7); color: #fff; }
  .snx a.snx-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .snx a.snx-btn--ghost {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: none;
  }
  .snx a.snx-btn--ghost:hover { background: rgba(255, 255, 255, 0.08); box-shadow: none; }
  .snx a.snx-btn--small { min-height: 42px; padding: 10px 22px; font-size: 14px; }

  /* Night sky backgrounds */
  .snx-night {
    background:
      radial-gradient(1200px 600px at 85% 10%, rgba(194, 64, 143, 0.28), transparent 60%),
      radial-gradient(900px 500px at 0% 100%, rgba(226, 189, 120, 0.12), transparent 60%),
      linear-gradient(170deg, var(--night) 0%, var(--night-2) 100%);
    color: rgba(255, 255, 255, 0.78);
    overflow: hidden;
  }
  .snx-night h1, .snx-night h2 { color: #fff; }
  .snx-stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .snx-stars circle { fill: #fff; }
  .snx-stars .tw { animation: snx-twinkle 4s ease-in-out infinite; }
  .snx-stars .tw:nth-child(3n) { animation-delay: 1.3s; }
  .snx-stars .tw:nth-child(3n+1) { animation-delay: 2.6s; }
  @keyframes snx-twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes snx-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @media (prefers-reduced-motion: reduce) {
    .snx-stars .tw, .snx-hero__img { animation: none !important; }
    .snx a.snx-btn { transition: none; }
  }

  /* Nav */
  .snx-nav { background: var(--night); }
  .snx-nav__inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 14px; padding-bottom: 14px; }
  .snx a.snx-nav__brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .snx-nav__brand img { width: 48px; height: 48px; border-radius: 50%; background: var(--cream); object-fit: contain; }
  .snx-nav__brand span { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.2; color: #fff; white-space: nowrap; }
  .snx-nav .snx-btn { white-space: nowrap; }
  @media (max-width: 420px) {
    .snx-nav__brand img { width: 40px; height: 40px; }
    .snx-nav .snx-btn--small { padding: 10px 16px; font-size: 13px; }
  }

  /* Hero */
  .snx-hero { padding: 56px 0 120px; }
  .snx-hero__grid { position: relative; display: grid; gap: 48px; align-items: center; }
  .snx-hero h1 { font-size: clamp(44px, 8vw, 76px); }
  .snx-hero h1 em { color: var(--gold); }
  .snx-hero .snx-lead { max-width: 520px; margin-top: 22px; font-size: 17px; }
  .snx-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
  .snx-hero__visual { position: relative; display: flex; justify-content: center; }
  .snx-hero__visual::before {
    content: '';
    position: absolute;
    inset: 8% 4%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(226, 189, 120, 0.35), transparent 70%);
    filter: blur(30px);
  }
  .snx-hero__img {
    position: relative;
    width: 100%;
    max-width: 540px;
    border-radius: var(--radius);
    box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.6);
    animation: snx-float 7s ease-in-out infinite;
  }
  .snx-hero__moon { position: absolute; top: -34px; right: 0; width: 92px; height: 92px; }
  .snx-wave { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 70px; display: block; }

  /* Guide */
  .snx-guide { padding: 70px 0 90px; background: var(--cream); }
  .snx-cards { display: grid; gap: 22px; }
  .snx-card {
    position: relative;
    padding: 36px 30px 34px;
    border: 1px solid rgba(155, 4, 111, 0.08);
    border-radius: var(--radius);
    background: #fff;
    box-shadow: 0 18px 40px -28px rgba(46, 20, 60, 0.35);
  }
  .snx-card__num {
    position: absolute;
    top: 22px;
    right: 26px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 40px;
    font-style: italic;
    line-height: 1;
    color: rgba(155, 4, 111, 0.14);
  }
  .snx-card__icon {
    display: grid;
    place-items: center;
    width: 60px;
    height: 60px;
    margin-bottom: 22px;
    border-radius: 18px;
    background: var(--lavender);
  }
  .snx-card__icon svg { width: 30px; height: 30px; }
  .snx-card h3 { margin-bottom: 8px; font-size: 27px; }
  .snx-center { margin-top: 48px; text-align: center; }

  /* Calm band */
  .snx-band { padding: 80px 0; background: linear-gradient(180deg, var(--lavender), var(--sand)); text-align: center; overflow: hidden; }
  .snx-band__sprig { position: absolute; display: none; width: 150px; height: auto; opacity: 0.55; }
  .snx-band__sprig--l { left: -10px; bottom: -10px; }
  .snx-band__sprig--r { right: -10px; top: -10px; transform: rotate(180deg); }
  .snx-band h2 { max-width: 760px; margin: 0 auto; font-size: clamp(32px, 5vw, 48px); }
  .snx-band h2 em { color: var(--plum); }
  .snx-band p { max-width: 600px; margin: 20px auto 0; }

  /* Stories */
  .snx-stories { padding: 90px 0; background: var(--cream); }
  .snx-stories__grid {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 86%;
    gap: 16px;
    margin: 0 -20px;
    padding: 6px 20px 26px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    list-style: none;
  }
  .snx-stories__grid::-webkit-scrollbar { display: none; }
  .snx-stories__grid li { scroll-snap-align: center; }
  .snx-stories__grid img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: var(--radius);
    background: #fff;
    box-shadow: var(--shadow);
  }
  .snx-hint { margin-top: 4px; font-size: 13px; text-align: center; }

  /* Meet Michele */
  .snx-meet { padding: 90px 0; background: var(--sand); }
  .snx-meet__grid { display: grid; gap: 44px; align-items: center; }
  .snx-meet__photo { position: relative; width: min(340px, 80%); margin: 0 auto; }
  .snx-meet__photo img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 50%; background: var(--cream); box-shadow: var(--shadow); }
  .snx-meet__ring { position: absolute; inset: -16px; width: calc(100% + 32px); height: calc(100% + 32px); }
  .snx-meet h2 { font-size: clamp(34px, 5vw, 48px); }
  .snx-meet p { margin-top: 18px; }
  .snx a.snx-link {
    display: inline-block;
    margin-top: 24px;
    font-weight: 500;
    color: var(--plum);
    text-decoration: none;
    border-bottom: 1px solid rgba(155, 4, 111, 0.35);
  }
  .snx a.snx-link:hover { border-bottom-color: var(--plum); }

  /* Final CTA */
  .snx-final { padding: 100px 0; text-align: center; }
  .snx-final h2 { position: relative; font-size: clamp(38px, 6vw, 62px); }
  .snx-final h2 em { color: var(--gold); }
  .snx-final p { position: relative; max-width: 560px; margin: 20px auto 34px; }
  .snx-final .snx-btn { position: relative; }

  /* Newsletter */
  .snx-news { padding: 80px 0; background: var(--cream); }
  .snx-news__card {
    max-width: 880px;
    margin: 0 auto;
    padding: 50px 26px;
    border-radius: 28px;
    background: linear-gradient(320deg, #86106a, #5e3653);
    text-align: center;
    color: rgba(255, 255, 255, 0.82);
    box-shadow: var(--shadow);
  }
  .snx-news h2 { font-size: clamp(30px, 4.5vw, 42px); color: #fff; }
  .snx-news p { margin-top: 12px; }
  .snx-news__form { max-width: 520px; margin: 28px auto 0; }
  .snx-form-placeholder {
    padding: 22px;
    border: 1px dashed rgba(255, 255, 255, 0.5);
    border-radius: 14px;
    font-size: 14px;
  }

  /* Footer */
  .snx-footer { padding: 34px 0; background: var(--night); text-align: center; font-size: 13px; color: rgba(255, 255, 255, 0.6); }
  .snx-footer strong { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; font-weight: 600; color: #fff; }

  @media (min-width: 750px) {
    .snx-container { padding: 0 40px; }
    .snx-nav__brand span { font-size: 22px; }
    .snx-band__sprig { display: block; }
    .snx-cards { grid-template-columns: repeat(3, 1fr); }
    .snx-stories__grid {
      grid-auto-flow: row;
      grid-auto-columns: auto;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0;
      overflow: visible;
    }
    .snx-hint { display: none; }
    .snx-news__card { padding: 64px 60px; }
  }
  @media (min-width: 990px) {
    .snx-hero { padding: 80px 0 150px; }
    .snx-hero__grid { grid-template-columns: 1.05fr 1fr; gap: 64px; }
    .snx-meet__grid { grid-template-columns: 0.9fr 1.1fr; gap: 80px; }
    .snx-band__sprig { width: 220px; }
  }
</style>
